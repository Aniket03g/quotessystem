services:
  backend:
    platform: linux/amd64
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: grove-backend
    env_file:
      - ./proxy/.env
    ports:
      - "8082:8082"
    environment:
      - DATABASE_PATH=/app/data/users.db
      - LOG_DIR=/app/logs
      - PROXY_CONFIG_PATH=/app/config/proxy.yaml
      # Warranty-reminder emails are sent by the Go proxy, not the frontend,
      # so it needs the same Resend credentials the frontend container gets.
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_FROM_ADMIN=${EMAIL_FROM_ADMIN}
      - APP_BASE_URL=${APP_BASE_URL}
    volumes:
      - ./data/db:/app/data
      - ./data/logs:/app/logs
      - ./proxy/config:/app/config:ro
    restart: unless-stopped
    networks:
      - grove-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - PUBLIC_API_BASE_URL=https://api.grovesystems.co
    container_name: grove-frontend
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=production
      - PUBLIC_API_BASE_URL=https://api.grovesystems.co
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_FROM_ADMIN=${EMAIL_FROM_ADMIN}
      # PDF digital-signing cert. The .p12 is gitignored / never in the image,
      # so it is bind-mounted below and this points the signer at it. If the
      # file is absent, quotes still send but go out UNSIGNED (safe fallback).
      - PDF_SIGNING_P12=/app/certs/grove-signing.p12
      # - PDF_SIGNING_P12_PASS=   # only if the .p12 has a passphrase
    volumes:
      # Supply the signing cert to the container without baking it into the image.
      # Copy grove-signing.p12 to ./frontend/certs/ on the VPS (scp) before deploy.
      - ./frontend/certs:/app/certs:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - grove-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4321"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  grove-network:
    driver: bridge

volumes:
  db-data:
  log-data: