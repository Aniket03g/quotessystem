# Generic NocoDB Proxy Configuration
# This file defines the schema-driven configuration for the proxy
nocodb:
  base_id: "pd0tf8xobxcryk6"

tables:
  quotes:
    name: "Quotes"
    operations: [read, create, update, delete, link]
    owner_fields: ["Quote Created By"]
    # Quote-number sequencing must count all quotes globally; exposing only the
    # sequence identifier is safe and required for correct numbering.
    public_read_fields: ["Quote Number"]

  products:
    name: "Products"
    operations: [read, create, update]

  accounts:
    name: "Accounts"
    operations: [read]

  contacts:
    name: "Contacts"
    operations: [read, create, update, delete, link]

  accounts_quotes:
    name: "Accounts Quotes"
    operations: [read, create, link]

  products_for_quotes:
    name: "ProductsForQuotes"
    operations: [read, update, create, delete, link]

  accounts_copy:
    name: "Accounts Copy"
    operations: [read, create, update, delete]

  cases:
    name: "Cases"
    operations: [read, create, update, delete, link]

  accounts_duplicate:
    name: "Accounts Duplicate"
    operations: [read, create, update, delete, link]
    owner_fields: ["Handled By"]

  leads:
    name: "Leads"
    operations: [read, create, update, delete, link]
    owner_fields: ["Lead Created By", "Assigned to"]

  # Warranty expiry reminders, backfilled from the Yealink AMC sheet.
  # "Assigned To" is deliberately left empty on the backfilled rows: admins and
  # super admins bypass owner filtering, so they see the whole list, while a
  # non-admin sees nothing until a row is explicitly assigned to them.
  warranty_reminders:
    name: "Warranty Reminders"
    operations: [read, create, update, delete]
    owner_fields: ["Assigned To"]

  # One row per covered serial. Cover runs per asset, not per invoice: an invoice
  # can mix 1/3/5-year terms, so the parent row's "Expiry Date" is only the
  # soonest of these and is written by the app, never typed.
  warranty_assets:
    name: "Warranty Assets"
    operations: [read, create, update, delete]
    owner_fields: ["Assigned To"]

